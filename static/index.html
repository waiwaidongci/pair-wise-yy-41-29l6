<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥梁结构监测与限行决策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}</style></head><body><h1>桥梁结构监测与限行决策</h1><p>融合传感、巡检、交通荷载和天气数据，生成限载限行或恢复建议</p><p>处置评估：读数达到阈值或有严重级未关闭异常建议封闭；读数达到阈值四分之三或有两项未关闭异常建议限行；其余继续观察。路政确认前须新建方向一致且当前有效的交通通告，告警版本变化后原评估失效；恢复前须关闭全部异常并撤销原通告，全程留痕审计。</p><button onclick="loadItems()">刷新列表</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
